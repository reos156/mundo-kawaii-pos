schema: spec-driven
strict_tdd: true

context: |
  Mundo Kawaii POS is an independent offline-first point-of-sale system for one physical store and one terminal.
  MVP roles are owner and cashier. The MVP covers checkout, cash shifts, local catalog and strict stock,
  basic reports, cash/transfer/split payments, printable tickets, and local offline persistence.
  Siigo is a workflow and visual reference only; integration is out of scope. Multi-store and multi-terminal
  operation are deferred.

  This repository is planning-only at this stage. Explore, proposal, spec, design, and tasks artifacts are
  authorized; implementation and code changes are not authorized.

rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    implementation_authorized: true
  verify:
    implementation_authorized: false
  archive:
    warn_before_destructive_deltas: true

testing:
  detected: "2026-09-08"
  runner:
    command: ""
    framework: "Not detected; repository currently contains planning documentation only"
  layers:
    unit: ""
    integration: ""
    e2e: ""
  commands:
    unit: []
    integration: []
    e2e: []
  coverage:
    command: ""
    commands: []

quality:
  lint: ""
  lint_commands: []
  typecheck: ""
  typecheck_commands: []
  format: ""
  format_commands: []
